[project]
name = "coastways"
version = "1.0.0"
description = "Coast Ways airport transfer booking website"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
